<div class="register-container">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <h1>Register Form</h1>
        <div>
            <label>FirstName</label>
            <input type="text" formControlName="FirstName" />
            <small class="error" *ngIf="registerForm.get('FirstName')?.invalid && registerForm.get('FirstName')?.touched">
                FirstName must be at least 3 characters
            </small>
        </div>
        <div>
            <label>LastName</label>
            <input type="text" formControlName="LastName" />
            <small  class="error" *ngIf="registerForm.get('LastName')?.invalid && registerForm.get('LastName')?.touched">
                LastName must be at least 3 characters
            </small>
        </div>
        <div>
            <label>Email</label>
            <input type="email" formControlName="Email" />
            <small class="error" *ngIf="registerForm.get('Email')?.invalid && registerForm.get('Email')?.touched">
                Enter valid Email
            </small>
        </div>
        <div>
            <label>Password</label>
            <input type="password" formControlName="Password" />
            <small class="error" *ngIf="registerForm.get('Password')?.invalid && registerForm.get('Password')?.touched">
                Password Must be at least 6 characters
            </small>
        </div>
        <div>
            <label>PhoneNo</label>
            <input type="text" formControlName="PhoneNo" />
            <small class="error" *ngIf="registerForm.get('PhoneNo')?.invalid && registerForm.get('PhoneNo')?.touched">
                Phone Number Must Contains 10 Numbers
            </small>
        </div>
        <div>
            <label>Gender</label>
            <select formControlName="Gender">
                <option value="">-select Gender--</option>
                <option *ngFor="let gender of genders" [value]="gender">{{gender}}</option>
            </select>
            <small class="error" *ngIf="registerForm.get('Gender')?.invalid && registerForm.get('Gender')?.touched">
                Please Select Gender
            </small>
        </div>
        <button type="submit" [disabled]="isLoading || registerForm.invalid">
            {{ isLoading ? 'Registering...' : 'Register'}}
        </button>

        <p *ngIf="errorMessage" style="color: red;">
            {{errorMessage}}
        </p>
    </form>
</div>
